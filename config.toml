# ─── Configuration de daybot (Coinbase Advanced, paires EUR) ───
# Sur le VPS, `python -m daybot run` fait tourner en permanence :
#   - le paper « ombre » de toutes les poches activées ;
#   - le réel, poche par poche, dès que les critères de [promotion] sont remplis.
# `mode` ne sert qu'aux anciennes commandes `paper` / `live` (intraday v1).
mode = "paper"
timezone = "Europe/Paris"

# Paires de la poche intraday (v1). Les autres poches ont leurs propres listes plus bas.
products = ["BTC-EUR", "ETH-EUR", "SOL-EUR", "XRP-EUR"]
portfolio_id = ""           # vide = portefeuille par défaut
quote_currency = "EUR"

[timeframes]
signal = "FIFTEEN_MINUTE"   # bougies d'entrée
trend  = "ONE_HOUR"         # filtre de tendance

[fees]                       # palier "Intro" lu sur le compte le 20/10/2026
maker = 0.0025
taker = 0.0050
slippage = 0.0005            # slippage estimé sur les sorties au stop

[strategy]
ema_fast = 9
ema_slow = 21
ema_trend = 50               # sur le timeframe "trend"
rsi_period = 14
rsi_min = 50
rsi_max = 70
atr_period = 14
stop_atr = 1.5               # stop = entrée - 1.5 × ATR
reward_risk = 2.0            # TP = entrée + 2R
# Le mouvement visé (TP - entrée) doit couvrir au moins N fois les frais aller-retour.
min_edge_over_fees = 3.0
entry_offset_atr = 0.1       # limite post-only légèrement sous le close (maker)
entry_ttl_bars = 2           # annule l'ordre d'entrée non rempli après N bougies
max_hold_bars = 32           # sortie forcée après 8 h en 15 min (pas de swing involontaire)

[risk]
risk_per_trade = 0.005       # 0,5 % du capital risqué par trade
max_position_pct = 0.25      # une position ≤ 25 % du capital
max_open_positions = 2
max_trades_per_day = 6
max_daily_loss = 0.02        # arrêt pour la journée à -2 %
max_drawdown = 0.10          # kill switch global à -10 % depuis le plus haut
min_order_quote = 10.0       # en dessous, on ne trade pas (frais/min Coinbase)
kill_switch_file = "data/STOP"   # créez ce fichier pour tout arrêter
# Pas de nouvelle entrée pendant les fenêtres macro (UTC). FOMC 28/10/2026 : 18h00 UTC.
blackout = [
  ["2026-10-28T16:00:00Z", "2026-10-29T02:00:00Z"],
]

[paper]
starting_balance = 1500.0     # capital fictif du paper (tendance + plusieurs mois de DCA)

[journal]
path = "data/journal.sqlite"

[macos]
notifications = true         # Centre de notifications : achats, sorties, arrêt du bot

# ─── Poches ───
[sleeves.dca]                 # cœur : achats hebdomadaires, JAMAIS de vente
enabled = true
monthly_eur = 100.0           # découpé en achats hebdomadaires (≈ 23 €/semaine)
weekday = 0                   # 0 = lundi
hour = 9                      # heure de Paris
minute = 0
tilt = false                  # ×1,5 sous la SMA200 / ×0,75 au-dessus de 1,5×SMA200 (voir page Stratégies)
reprice_minutes = 30
max_wait_hours = 6

[sleeves.dca.weights]         # répartition cible (les achats vont d'abord à l'actif sous-pondéré)
"BTC-EUR" = 0.7
"ETH-EUR" = 0.3

[sleeves.trend]               # tactique : suivi de tendance journalier, stop suiveur sur l'exchange
enabled = true
products = ["BTC-EUR", "ETH-EUR", "SOL-EUR"]
capital_eur = 300.0           # capital alloué à la poche
risk_per_trade = 0.01         # 1 % du capital de la poche risqué au stop initial
max_asset_pct = 0.5           # une position ≤ 50 % du capital de la poche
# Paramètres de manuel, NON optimisés : sma_regime=200, donchian_entry=20,
# donchian_exit=10, atr_period=20, atr_mult=3.0 (modifiables ici).

[sleeves.intraday]            # daytrading 15 min v1 : perdant en backtest (frais) → désactivé
enabled = false
capital_eur = 300.0

# ─── Passage en réel ───
[promotion]
auto = true                   # promotion automatique quand tous les critères sont remplis
dca_min_days = 7
trend_min_days = 30
trend_min_oos_profit_factor = 1.2
trend_max_oos_drawdown = 0.25
# Plafond d'euros réels que le bot peut engager (positions + achats DCA cumulés).
# 0 = aucun euro réel, même si les autres critères sont remplis.
max_live_capital_eur = 0.0

# ─── Analyste IA (API Claude) ───
[ai]
enabled = true                # nécessite la clé ANTHROPIC_API_KEY (ou le secret Docker)
model = "claude-opus-5-5"
effort = "high"
daily_hour = 7                # rapport quotidien, heure de Paris
daily_minute = 30
monthly_budget_usd = 15.0     # au-delà : plus aucun appel jusqu'au mois suivant
max_questions_per_day = 20
web_search_max_uses = 5

# ─── Site web (Cloudflare Tunnel + Access) ───
[web]
cf_team_domain = ""           # ex. "monequipe.cloudflareaccess.com" (Zero Trust → Settings)
cf_aud = ""                   # « Application Audience (AUD) Tag » de l'application Access
host = "127.0.0.1"
port = 8080
